[package]
name = "thomas-ai"
version = "0.1.0"
edition = "2021"
description = "Thomas AI: Apple Silicon local AI gateway with MLX, EXO/RDMA, and NVIDIA routing"
license = "MIT"
keywords = ["apple-silicon", "mlx", "nvidia", "llm", "ai-gateway"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
